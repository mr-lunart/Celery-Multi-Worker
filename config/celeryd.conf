CELERY_APP="app_v2"
CELERY_BIN="/home/ubuntu/celery/.venv/bin/celery"

# define 2 worker
CELERYD_NODES="worker_1"

# setting for log and PID
CELERYD_PID_FILE="/home/ubuntu/celery/logs/worker/run/%n.pid"
CELERYD_LOG_FILE="/home/ubuntu/celery/logs/worker/log/%n%I.log"
CELERYD_LOG_LEVEL="INFO"

# option for both worker
# -c = concurrency, -P = pool, -Q = queue
# CELERYD_OPTS="-c:worker1 10 -P:worker1 threads -Q:worker1 dowload-upload \
#               -c:worker2 20 -P:worker2 threads"

CELERYD_OPTS="-c:worker_1 20 -P:worker1 threads"
