CELERY_APP="app_v2"
CELERY_BIN="/home/ubuntu/Celery-Multi-Worker/.venv/bin/celery"

# define 2 worker
CELERYD_NODES="worker_1 worker_2 worker_3 worker_4 worker_5"

# setting for log and PID
CELERYD_PID_FILE="/home/ubuntu/Celery-Multi-Worker/logs/worker/run/%n.pid"
CELERYD_LOG_FILE="/home/ubuntu/Celery-Multi-Worker/logs/worker/log/%n%I.log"
CELERYD_LOG_LEVEL="INFO"

# option for both worker
# -c = concurrency, -P = pool, -Q = queue
# CELERYD_OPTS="-c:worker1 10 -P:worker1 threads -Q:worker1 dowload-upload \
#               -c:worker2 20 -P:worker2 threads"

CELERYD_OPTS="-c:worker_1 5 -P:worker_1 prefork \
              -c:worker_2 5 -P:worker_2 prefork \
              -c:worker_3 5 -P:worker_3 prefork \
              -c:worker_4 5 -P:worker_4 prefork \
              -c:worker-5 5 -P:worker_5 prefork"
